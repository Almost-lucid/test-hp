name: drafts
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
  pages: read
jobs:
  drafts:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Template-filled drafts only. No model, no API key, and nothing is posted anywhere.
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })).data
              .filter(p => p.merged_at);
            if (!prs.length) { core.info(`No merged PR for ${sha}; nothing to draft.`); return; }
            const pr = prs[0];
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const slugs = [...new Set(files.filter(f => f.status === 'added' && /^demos\/[^/]+\/index\.html$/.test(f.filename))
              .map(f => f.filename.split('/')[1]))];
            if (!slugs.length) { core.info('PR added no new demos.'); return; }

            const read = async (p) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: p, ref: sha });
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            let base = '';
            try { base = (JSON.parse(await read('site.json')).base_url || '').trim(); } catch {}
            if (!base) {
              try { base = (await github.rest.repos.getPages({ owner, repo })).data.html_url; }
              catch { base = repo.toLowerCase() === `${owner.toLowerCase()}.github.io` ? `https://${owner.toLowerCase()}.github.io` : `https://${owner.toLowerCase()}.github.io/${repo}`; }
            }
            base = base.replace(/\/$/, '');

            for (const slug of slugs) {
              let meta = { title: slug, pitch: '' };
              try { meta = { ...meta, ...JSON.parse(await read(`demos/${slug}/demo.json`)) }; } catch {}
              const live = `${base}/${slug}/`;
              const video = `${base}/${slug}/demo.mp4`;
              const linkedin = [
                `New demo: ${meta.title}.`,
                '',
                `${meta.pitch}`,
                '',
                `It started as one idea written in a GitHub issue. An AI coding agent built it and opened a pull request, ` +
                `then an automatic check loaded it on a phone-sized screen, failed on any errors or sideways scrolling, and recorded a short video. ` +
                `A human watched that video and approved it before it went live, and a human (me) is the one posting this.`,
                '',
                `It's a small static page with placeholder data, so there's nothing to sign up for. Have a play and tell me what you'd change.`,
                '',
                `Try it: ${live}`,
                `20-second video: ${video}`,
                '',
                '#buildinpublic #prototyping',
              ].join('\n');
              let x = `New demo: ${meta.title}. ${meta.pitch} One idea → AI agent → auto-checked → human-approved. ${live}`;
              if (x.length > 280) x = `New demo: ${meta.title}. Idea → AI agent → checked → human-approved. ${live}`;
              const body = [
                `<!-- host-and-post:drafts:${slug} -->`,
                `### 📝 Post drafts for \`${slug}\` (gate 2)`,
                `**Live:** ${live}  ·  **Video:** ${video}`,
                '',
                '> **Nothing has been posted.** These are drafts only. Edit them, then publish them yourself on LinkedIn and X (attach the video for best reach). Not posting is a fine answer too.',
                '',
                '<details open><summary>LinkedIn draft</summary>',
                '',
                '```text', linkedin, '```', '</details>',
                '',
                `<details open><summary>X draft (${x.length}/280)</summary>`,
                '',
                '```text', x, '```', '</details>',
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
